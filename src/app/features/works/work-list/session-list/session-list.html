<div class="session-content">
  <div class="session-metadata  session-section">
    <div class="session-date">{{ session().date | partialDate }}</div>
    <div class="session-modalities">{{ session().modalities }}</div>
    <div class="session-ended">
      <strong>{{endMessage}}</strong>
      @if(session().endedPrecision){
      : {{ session().endedPrecision}}
      }
    </div>
  </div>

  <div class="session-comment session-section">{{ session().comment }}</div>
  <div class="session-moods  session-section">
    <span class = "moods-prefix">Mes ressentis: </span> {{moods}}
  </div>

</div>
